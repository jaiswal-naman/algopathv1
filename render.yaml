# Render Blueprint for LFA Builder Platform
# https://render.com/docs/blueprint-spec

services:
  # Backend API Service
  - type: web
    name: lfa-builder-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false  # Set this manually in Render dashboard
      - key: DATABASE_URL
        sync: false  # Set this manually or use Render PostgreSQL
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: lfa-templates
      - key: PYTHON_VERSION
        value: "3.11"

